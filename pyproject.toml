[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "uk-wind-evaluator"
version = "0.1.0"
description = "UK Energy Utility - Wind Generation & Forecast Evaluation Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pandas>=2.2.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "matplotlib>=3.8.0",
    "ipykernel>=6.29.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "api*"]
exclude = ["frontend*", "notebooks*", "scripts*", "docs*", "data*"]


[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
