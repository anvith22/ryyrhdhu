name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  backend:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Ruff linter
        run: ruff check .

      - name: Run Pytest test suite
        run: pytest backend/tests -v

  frontend:
    name: Frontend Lint, Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run Vitest unit tests
        run: npm test -- --run

      - name: Build frontend production bundle
        run: npm run build

  docker:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t uk-wind-evaluator .

      - name: Run container in background
        run: docker run -d --name wind-app -e PORT=8080 -p 8080:8080 uk-wind-evaluator

      - name: Wait for container health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/api/health > /dev/null; then
              echo "Container is healthy!"
              exit 0
            fi
            echo "Waiting for service to be healthy... ($i/30)"
            sleep 2
          done
          echo "Health check timed out!"
          docker logs wind-app
          exit 1

      - name: Test metrics endpoint
        run: |
          RESPONSE=$(curl -sf "http://127.0.0.1:8080/api/metrics?start=2026-01-01&end=2026-01-31&cutoff_hour=9")
          echo "Metrics response: $RESPONSE"
          python3 -c "
          import json, sys
          data = json.loads('''$RESPONSE''')
          assert data.get('coverage') == 1.0, f'Expected coverage == 1.0, got {data.get(\"coverage\")}'
          mae = data.get('mae', 0)
          assert 2140 <= mae <= 2145, f'Expected MAE around 2142, got {mae}'
          print(f'Assertion passed: coverage={data.get(\"coverage\")}, mae={mae}')
          "

      - name: Test frontend root serving
        run: |
          HTML_OUTPUT=$(curl -s http://127.0.0.1:8080/)
          echo "$HTML_OUTPUT" | grep -i "<!doctype html>" || (echo "Root did not serve HTML"; exit 1)
          echo "$HTML_OUTPUT" | grep -i "UK Wind Generation Forecast" || (echo "Expected title in HTML"; exit 1)
          echo "Frontend HTML verified!"

      - name: Output container logs on failure
        if: failure()
        run: docker logs wind-app
